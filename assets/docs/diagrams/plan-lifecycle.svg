<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">The life of a plan</title>
  <desc id="d">A goal or source goes to the planner. You approve the plan. The coordinator places workers in waves; each Task has a worker in its own worktree and a fresh reviewer. A planner replans between waves, runs a final check, and the plan is delivered as a pull request, a push, a merge on this computer, or by hand. Amber marks show where Astera asks you.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #11161d; }
    .title { fill: #f1f5f9; font-size: 24px; font-weight: 700; }
    .grp { fill: none; stroke: #3b4a5e; stroke-width: 1.5; }
    .glabel { fill: #9fb0c3; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
    .box { fill: #1c2430; stroke: #3b4a5e; stroke-width: 1.5; }
    .you { fill: #1c2430; stroke: #f5b942; stroke-width: 2.5; }
    .name { fill: #f1f5f9; font-size: 17px; font-weight: 700; }
    .small { fill: #9fb0c3; font-size: 14px; }
    .arrow { fill: none; stroke: #c4f25a; stroke-width: 2; marker-end: url(#ah); }
    .lbl { fill: #c4f25a; font-size: 13px; font-weight: 600; }
    .ask { fill: #f5b942; }
    .askt { fill: #2a1d00; font-size: 14px; font-weight: 800; }
    .legend { fill: #f1f5f9; font-size: 14px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4f25a"/></marker>
  </defs>
  <rect class="bg" width="960" height="640" rx="24"/>
  <text class="title" x="40" y="48">The life of a plan</text>

  <!-- top row -->
  <rect class="box" x="40" y="76" width="190" height="64" rx="10"/>
  <text class="name" x="135" y="102" text-anchor="middle">Goal or source</text>
  <text class="small" x="135" y="124" text-anchor="middle">text, issue, audit, CLI</text>
  <path class="arrow" d="M230 108H268"/>
  <rect class="box" x="270" y="76" width="190" height="64" rx="10"/>
  <text class="name" x="365" y="102" text-anchor="middle">Planner</text>
  <text class="small" x="365" y="124" text-anchor="middle">writes the Tasks</text>
  <path class="arrow" d="M460 108H498"/>
  <rect class="you" x="500" y="76" width="190" height="64" rx="10"/>
  <text class="name" x="595" y="102" text-anchor="middle">Approve &amp; execute</text>
  <text class="small" x="595" y="124" text-anchor="middle">you read the plan</text>
  <circle class="ask" cx="690" cy="76" r="12"/><text class="askt" x="690" y="81" text-anchor="middle">!</text>
  <path class="arrow" d="M690 108H728"/>
  <rect class="box" x="730" y="76" width="190" height="64" rx="10"/>
  <text class="name" x="825" y="102" text-anchor="middle">Coordinator</text>
  <text class="small" x="825" y="124" text-anchor="middle">places workers only</text>

  <!-- coordinator to waves -->
  <path class="arrow" d="M825 140V166H360V190"/>
  <text class="lbl" x="372" y="184">a worker for every ready Task</text>

  <!-- waves -->
  <rect class="grp" x="40" y="192" width="640" height="226" rx="14"/>
  <text class="glabel" x="58" y="218">WAVE: TASKS WHOSE DEPENDENCIES ARE DONE, SIDE BY SIDE</text>
  <rect class="box" x="58" y="234" width="250" height="44" rx="10"/>
  <text class="name" x="183" y="262" text-anchor="middle">Worker, own worktree</text>
  <path class="arrow" d="M308 256H370"/>
  <rect class="box" x="372" y="234" width="250" height="44" rx="10"/>
  <text class="name" x="497" y="262" text-anchor="middle">Fresh reviewer</text>
  <rect class="box" x="58" y="290" width="250" height="44" rx="10"/>
  <text class="name" x="183" y="318" text-anchor="middle">Worker, own worktree</text>
  <path class="arrow" d="M308 312H370"/>
  <rect class="box" x="372" y="290" width="250" height="44" rx="10"/>
  <text class="name" x="497" y="318" text-anchor="middle">Fresh reviewer</text>
  <rect class="box" x="58" y="346" width="250" height="44" rx="10"/>
  <text class="name" x="183" y="374" text-anchor="middle">Worker, own worktree</text>
  <path class="arrow" d="M308 368H370"/>
  <rect class="box" x="372" y="346" width="250" height="44" rx="10"/>
  <text class="name" x="497" y="374" text-anchor="middle">Fresh reviewer</text>
  <text class="small" x="58" y="408">A blocking finding goes back to the worker, up to 5 rounds.</text>
  <circle class="ask" cx="680" cy="192" r="12"/><text class="askt" x="680" y="197" text-anchor="middle">!</text>
  <text class="small" x="635" y="270">Task</text>
  <text class="small" x="635" y="288">done</text>

  <!-- replan, final check -->
  <path class="arrow" d="M680 280H728"/>
  <rect class="box" x="730" y="236" width="190" height="88" rx="10"/>
  <text class="name" x="825" y="264" text-anchor="middle">Replan</text>
  <text class="small" x="825" y="286" text-anchor="middle">between waves, a fresh</text>
  <text class="small" x="825" y="305" text-anchor="middle">planner adjusts the rest</text>
  <path class="arrow" d="M825 324V362"/>
  <rect class="you" x="730" y="364" width="190" height="88" rx="10"/>
  <text class="name" x="825" y="392" text-anchor="middle">Final check</text>
  <text class="small" x="825" y="414" text-anchor="middle">result against the goal,</text>
  <text class="small" x="825" y="433" text-anchor="middle">up to 3 follow-up waves</text>
  <circle class="ask" cx="920" cy="364" r="12"/><text class="askt" x="920" y="369" text-anchor="middle">!</text>

  <!-- delivery -->
  <path class="arrow" d="M825 452V478H605V502"/>
  <path class="arrow" d="M825 478V502"/>
  <rect class="box" x="480" y="504" width="250" height="68" rx="10"/>
  <text class="name" x="605" y="530" text-anchor="middle">Delivery: pr (default)</text>
  <text class="small" x="605" y="552" text-anchor="middle">one PR per plan, never merged</text>
  <rect class="you" x="750" y="504" width="170" height="68" rx="10"/>
  <text class="name" x="835" y="530" text-anchor="middle">Delivery: push</text>
  <text class="small" x="835" y="552" text-anchor="middle">merge, check, push</text>
  <circle class="ask" cx="920" cy="504" r="12"/><text class="askt" x="920" y="509" text-anchor="middle">!</text>

  <!-- legend -->
  <circle class="ask" cx="52" cy="548" r="12"/><text class="askt" x="52" y="553" text-anchor="middle">!</text>
  <text class="legend" x="74" y="553">Astera asks you, in the Needs you tab:</text>
  <text class="small" x="40" y="580">Plan ready. A Task out of attempts or review rounds.</text>
  <text class="small" x="40" y="602">A plan that no longer holds together. A push that finds a dirty folder, the wrong branch or a conflict.</text>
  <text class="small" x="40" y="624">Auto-approve and hands-off plans skip some of these questions.</text>
</svg>
